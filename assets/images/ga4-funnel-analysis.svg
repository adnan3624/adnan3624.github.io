<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-label="Funnel chart from item views through add to cart and checkout to purchase."><rect width="800" height="420" fill="#fff"/><text x="30" y="38" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#0d1b2e">Session funnel</text><text x="30" y="58" font-family="Arial,sans-serif" font-size="12" fill="#556070">GA4 e-commerce events, one month, sessions</text><rect x="30" y="90" width="700" height="46" fill="#1e56d6" opacity="1.0"/><text x="42" y="118" text-anchor="start" font-family="Arial,sans-serif" font-size="14" fill="#fff" font-weight="700">Item views</text><text x="740.0" y="118" text-anchor="start" font-family="Arial,sans-serif" font-size="13" fill="#0d1b2e" font-weight="600">10,000</text><rect x="30" y="156" width="192" height="46" fill="#1e56d6" opacity="0.88"/><text x="42" y="184" text-anchor="start" font-family="Arial,sans-serif" font-size="14" fill="#fff" font-weight="700">Add to cart</text><text x="231.6" y="184" text-anchor="start" font-family="Arial,sans-serif" font-size="13" fill="#0d1b2e" font-weight="600">1,800  (18% of previous step)</text><rect x="30" y="222" width="136" height="46" fill="#1e56d6" opacity="0.76"/><text x="42" y="250" text-anchor="start" font-family="Arial,sans-serif" font-size="14" fill="#fff" font-weight="700">Begin checkout</text><text x="175.8" y="250" text-anchor="start" font-family="Arial,sans-serif" font-size="13" fill="#0d1b2e" font-weight="600">900  (50% of previous step)</text><rect x="30" y="288" width="106" height="46" fill="#0d1b2e" opacity="0.64"/><text x="42" y="316" text-anchor="start" font-family="Arial,sans-serif" font-size="14" fill="#fff" font-weight="700">Purchase</text><text x="146.04" y="316" text-anchor="start" font-family="Arial,sans-serif" font-size="13" fill="#0d1b2e" font-weight="600">420  (47% of previous step)</text><text x="770" y="406" text-anchor="end" font-family="Arial,sans-serif" font-size="11" fill="#556070">Synthetic data for illustration</text></svg>